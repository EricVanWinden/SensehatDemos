<!DOCTYPE html>
<html>
<head>
    <title>Sensor Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Sensor Graph</h1>
    <canvas id="chart" width="800" height="400"></canvas>

    <script>
        fetch("/sensor_data")
            .then(response => response.json())
            .then(data => {
                const labels = data.map(row => row.timestamp);

                const temps = data.map(row => row.temperature);
                const hums = data.map(row => row.humidity);
                const press = data.map(row => row.pressure);

                new Chart(document.getElementById("chart"), {
                    type: "line",
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: "Temperature (C)",
                                data: temps,
                                borderColor: "red",
                                fill: false
                            },
                            {
                                label: "Humidity (%)",
                                data: hums,
                                borderColor: "blue",
                                fill: false
                            },
                            {
                                label: "Pressure (mbar)",
                                data: press,
                                borderColor: "green",
                                fill: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        interaction: { mode: "index", intersect: false },
                        stacked: false,
                        scales: {
                            y: {
                                title: { display: true, text: "Value" }
                            }
                        }
                    }
                });
            });
    </script>
</body>
</html>
