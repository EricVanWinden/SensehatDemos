<!DOCTYPE html>
<html>
<head>
	<title>Sensehat Control</title>
	<style>
		body { 
			font-family: Arial; 
			padding: 20px; 
			max-width: 600px;
			margin: auto;
		}

		.button-grid {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
		}

		.button-grid button {
			flex: 1 1 45%;
			margin: 10px;
			padding: 12px 20px;
			font-size: 16px;
			cursor: pointer;
		}

		input[type='text'] {
			padding: 10px;
			font-size: 16px;
			width: 90%;
			margin: 10px 0;
		}

		button[type='submit'] {
			padding: 12px 20px;
			font-size: 16px;
			cursor: pointer;
			margin-top: 10px;
		}
	</style>
</head>
<body>
	<h1>Sensehat Control Panel</h1>
	<div class="button-grid">
		<button onclick="window.location.href='/graph/minute'">Minute graph</button>
		<button onclick="window.location.href='/graph/hour'">Hour graph</button>
		<button onclick="window.location.href='/graph/day'">Day graph</button>
		<button onclick="window.location.href='/download_log'">Download log</button>
		<button onclick="window.location.href='/download_p1_log'">Download P1 log</button>
		<button onclick="window.location.href='/all_sensors'">Read all sensors</button>
		<button onclick="window.location.href='/rotate_matrix'">Rotate the matrix</button>
		<button onclick="window.location.href='/use_joystick'">Joystick</button>
		<button onclick="window.location.href='/apidocs'">API documentation</button>
	</div>

<h2>Text display</h2>
<form method="POST">
    <input type="text" name="text_to_display" placeholder="Text to display">
    <input type="number"
           name="repeats"
           value="5"
           min="1"
           max="50"
           step="1"
           placeholder="Repeats">
    <button type="submit" formaction="/display_text">Display text</button>
</form>

</body>
</html>
