<!DOCTYPE html>
<html>
<head>
	<title>Sensehat Control</title>
	<style>
		body { 
			font-family: Arial; 
			padding: 20px; 
			max-width: 600px;
			margin: auto;
		}

		.button-grid {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
		}

		.button-grid button {
			flex: 1 1 45%;
			margin: 10px;
			padding: 12px 20px;
			font-size: 16px;
			cursor: pointer;
		}

		input[type='text'] {
			padding: 10px;
			font-size: 16px;
			width: 90%;
			margin: 10px 0;
		}

		button[type='submit'] {
			padding: 12px 20px;
			font-size: 16px;
			cursor: pointer;
			margin-top: 10px;
		}
	</style>
</head>
<body>
	<h1>Sensehat Control Panel</h1>
	<div class="button-grid">
		<button onclick="window.location.href='/sound'">Play sound</button>
		<button onclick="window.location.href='/apidocs'">API documentation</button>
	</div>
</body>
</html>
